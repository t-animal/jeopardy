[mypy]
python_version = 3.11
pretty = True
show_error_codes = True
files = risiko_anwendung/**/*.py
warn_unused_ignores = True
warn_redundant_casts = True
warn_return_any = True
no_implicit_optional = True

# This project is GTK (PyGObject) based. Typing support for gi/Gtk varies widely
# across environments, so we treat it as an external dynamic dependency.
[mypy-gi]
ignore_missing_imports = True

[mypy-gi.*]
ignore_missing_imports = True

[mypy-cairo]
ignore_missing_imports = True

[mypy-cairo.*]
ignore_missing_imports = True

# `PyYAML` is used extensively; we install `types-PyYAML` for better coverage.
# `PyGObject-stubs` is used for Gtk/Gdk/GObject typing coverage.
